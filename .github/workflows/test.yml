name: Continuous integration

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  TINYGO_VERSION: "0.39.0"
  TINYGO_DEB_SHA256: "775f15974e35059c8f3a141266bd9d293b5d556a3e44d5e6356c5602e9f386ab"

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: make lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  e2e-tests:
    name: Build Wasm and run e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install tinygo
        run: |
          set -euo pipefail
          deb="tinygo_${TINYGO_VERSION}_amd64.deb"
          wget -q "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${deb}"
          echo "${TINYGO_DEB_SHA256}  ${deb}" | sha256sum --check
          sudo dpkg -i "${deb}"
          tinygo version
      - name: Install kwctl
        uses: kubewarden/github-actions/kwctl-installer@540e407be3b5eb379482bd9ea2a2de51a79a74cb # v4.x
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Build and annotate policy
        run: make annotated-policy.wasm
      - name: Run e2e tests
        run: make e2e-tests
      - name: Upload policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: policy
          path: |
            policy.wasm
            annotated-policy.wasm
